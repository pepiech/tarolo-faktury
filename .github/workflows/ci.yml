name: CI a nasazení

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: faktury
          POSTGRES_PASSWORD: faktury-ci
          POSTGRES_DB: faktury
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faktury"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: faktury
      POSTGRES_USER: faktury
      POSTGRES_PASSWORD: faktury-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - name: Systémové knihovny pro PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Závislosti
        run: |
          pip install -r requirements.lock.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Ruff
        run: ruff check src
      - name: Django check
        run: python src/manage.py check
      - name: Chybějící migrace
        run: python src/manage.py makemigrations --check --dry-run
      - name: Testy (včetně E2E v prohlížeči)
        run: pytest

  deploy-staging:
    name: Nasazení na staging
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, faktury-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: faktury-deploy staging
        env:
          SHA: ${{ github.sha }}
        run: sudo -n /usr/local/sbin/faktury-deploy staging "$SHA"

  deploy-production:
    name: Nasazení do produkce
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: [self-hosted, faktury-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: faktury-deploy production
        env:
          SHA: ${{ github.sha }}
        run: sudo -n /usr/local/sbin/faktury-deploy production "$SHA"
